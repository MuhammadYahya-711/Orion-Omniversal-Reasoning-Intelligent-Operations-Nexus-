// GenMB auth SDK (Capability)
(function() {
class GenMBGoogleAuth {
  constructor({ appId, baseUrl, onError }) {
    if (!appId) {
      throw new Error('GenMBGoogleAuth: appId is required')
    }

    this.appId = appId
    this.baseUrl = (baseUrl || '/api/auth/google').replace(/\/$/, '')
    this.user = null
    this.listeners = []
    this.onError = onError || console.error
    this._ready = false
    this._readyPromise = null
    this._refreshTimer = null
  }

  async ready() {
    if (this._ready) return this
    if (this._readyPromise) return this._readyPromise

    var self = this
    this._readyPromise = this.checkSession().then(function () {
      if (!self.user) {
        var params = new URLSearchParams(window.location.search)
        var magicToken = params.get('magic_token')
        if (magicToken) {
          return self.verifyMagicLink(magicToken).catch(function () {
          }).then(function () {
            params.delete('magic_token')
            var cleanUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '') + window.location.hash
            window.history.replaceState({}, '', cleanUrl)
          })
        }
      }
    }).then(function () {
      self._ready = true
      return self
    })
    return this._readyPromise
  }

  async signIn() {
    return new Promise((resolve, reject) => {
      let settled = false

      var width = 500
      var height = 600
      var left = window.screenX + (window.outerWidth - width) / 2
      var top = window.screenY + (window.outerHeight - height) / 2

      var navBase = this.baseUrl
      var extraOrigin = ''
      var host = window.location.hostname || ''
      if (/^preview-\d+-/.test(host) && host.slice(-10) === '.genmb.com') {
        navBase = 'https://' + host.split('.').slice(-2).join('.') + '/api/auth/google'
        extraOrigin = '&origin=' + encodeURIComponent(window.location.origin)
      }

      var popup = window.open(
        navBase + '/authorize?app_id=' + encodeURIComponent(this.appId) + '&redirect=popup' + extraOrigin,
        'genmb-google-signin',
        'width=' + width + ',height=' + height + ',left=' + left + ',top=' + top + ',popup=1'
      )

      if (!popup || popup.closed) {
        window.location.href = navBase + '/authorize?app_id=' + encodeURIComponent(this.appId) + '&redirect=' + encodeURIComponent(window.location.href) + extraOrigin
        resolve(null)
        return
      }

      var pollSession = null

      var cleanup = function () {
        clearTimeout(timeout)
        clearInterval(checkClosed)
        if (pollSession) clearInterval(pollSession)
        window.removeEventListener('message', handleMessage)
      }

      var self = this

      var finishWithUser = function (user) {
        if (settled) return
        settled = true
        cleanup()
        try { popup.close() } catch (e) { }
        resolve(user)
      }

      var timeout = setTimeout(function () {
        if (settled) return
        settled = true
        cleanup()
        try { popup.close() } catch (e) { }
        var error = new Error("Sign-in took too long. Please try again.")
        error.code = 'SIGN_IN_TIMEOUT'
        self.onError(error)
        reject(error)
      }, 120000)

      var handleMessage = function (event) {
        var origin = event.origin
        var isGenmb = origin === 'https://genmb.com' || origin.endsWith('.genmb.com')
        var isLocalhost = origin.startsWith('http://localhost') || origin.startsWith('http://127.0.0.1')
        if (!isGenmb && !isLocalhost) return
        if (settled) return

        if (event.data && event.data.error) {
          settled = true
          cleanup()
          var error = new Error(event.data.error)
          error.code = 'SIGN_IN_FAILED'
          self.onError(error)
          reject(error)
        } else if (event.data && event.data.user) {
          self.user = event.data.user
          self._notifyListeners()
          self._startRefreshTimer()
          finishWithUser(self.user)
        }
      }

      var checkingSession = false
      var pollStartedAt = Date.now()
      var pollTick = function () {
        if (settled || checkingSession) return
        checkingSession = true
        self.checkSession().then(function (user) {
          checkingSession = false
          if (user && !settled) finishWithUser(user)
        }).catch(function () { checkingSession = false })
      }
      pollSession = setInterval(function () {
        pollTick()
        if (!settled && pollSession && Date.now() - pollStartedAt >= 30000) {
          clearInterval(pollSession)
          pollSession = setInterval(pollTick, 5000)
        }
      }, 1500)

      var checkClosed = setInterval(function () {
        var closed = false
        try { closed = popup.closed } catch (e) { closed = false }
        if (!closed || settled) return
        self.checkSession().then(function (user) {
          if (settled) return
          if (user) finishWithUser(user)
          else { settled = true; cleanup(); resolve(null) }
        }).catch(function () {
          if (settled) return
          settled = true; cleanup(); resolve(null)
        })
      }, 500)

      window.addEventListener('message', handleMessage)
    })
  }

  async sendMagicLink(email) {
    try {
      var res = await fetch('/api/auth/email/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, app_id: this.appId }),
        credentials: 'include'
      })
      return await res.json()
    } catch (err) {
      var error = new Error("We couldn't send the sign-in link. Check your connection and try again.")
      error.code = 'NETWORK_ERROR'
      this.onError(error)
      throw error
    }
  }

  async verifyMagicLink(token) {
    try {
      var res = await fetch(
        '/api/auth/email/verify?token=' + encodeURIComponent(token) + '&app_id=' + encodeURIComponent(this.appId),
        { credentials: 'include' }
      )
      if (!res.ok) {
        var error = new Error("This sign-in link has expired or already been used. Send yourself a new one.")
        error.code = 'VERIFY_FAILED'
        this.onError(error)
        return null
      }
      var data = await res.json()
      if (data.success && data.user) {
        this.user = data.user
        this._notifyListeners()
        this._startRefreshTimer()
      }
      return this.user
    } catch (err) {
      var error = new Error("We couldn't sign you in. Check your connection and try again.")
      error.code = 'NETWORK_ERROR'
      this.onError(error)
      return null
    }
  }

  async signUp(email, password, name) {
    try {
      var res = await fetch('/api/auth/password/signup-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password, name: name || null, app_id: this.appId }),
        credentials: 'include',
      })
      var data = await res.json()
      if (!data.success) {
        var err = new Error(data.error || 'Sign-up failed')
        err.code = 'SIGNUP_FAILED'
        this.onError(err)
        throw err
      }
      return data
    } catch (err) {
      if (err && err.code) throw err
      var nerr = new Error("We couldn't reach the server. Check your connection and try again.")
      nerr.code = 'NETWORK_ERROR'
      this.onError(nerr)
      throw nerr
    }
  }

  async verifySignUp(email, code) {
    try {
      var res = await fetch('/api/auth/password/signup-verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, code: code, app_id: this.appId }),
        credentials: 'include',
      })
      var data = await res.json()
      if (!data.success || !data.user) {
        var err = new Error(data.error || 'Verification failed')
        err.code = 'SIGNUP_FAILED'
        this.onError(err)
        throw err
      }
      this.user = data.user
      this._notifyListeners()
      this._startRefreshTimer()
      return this.user
    } catch (err) {
      if (err && err.code) throw err
      var nerr = new Error("We couldn't reach the server. Check your connection and try again.")
      nerr.code = 'NETWORK_ERROR'
      this.onError(nerr)
      throw nerr
    }
  }

  async signInWithPassword(email, password) {
    try {
      var res = await fetch('/api/auth/password/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password, app_id: this.appId }),
        credentials: 'include',
      })
      var data = await res.json()
      if (!data.success || !data.user) {
        var err = new Error(data.error || 'Invalid email or password')
        err.code = 'LOGIN_FAILED'
        this.onError(err)
        throw err
      }
      this.user = data.user
      this._notifyListeners()
      this._startRefreshTimer()
      return this.user
    } catch (err) {
      if (err && err.code) throw err
      var nerr = new Error("We couldn't reach the server. Check your connection and try again.")
      nerr.code = 'NETWORK_ERROR'
      this.onError(nerr)
      throw nerr
    }
  }

  async requestPasswordReset(email) {
    try {
      var res = await fetch('/api/auth/password/reset-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, app_id: this.appId }),
        credentials: 'include',
      })
      return await res.json()
    } catch (err) {
      var nerr = new Error("We couldn't reach the server. Check your connection and try again.")
      nerr.code = 'NETWORK_ERROR'
      this.onError(nerr)
      throw nerr
    }
  }

  async confirmPasswordReset(email, code, newPassword) {
    try {
      var res = await fetch('/api/auth/password/reset-confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, code: code, newPassword: newPassword, app_id: this.appId }),
        credentials: 'include',
      })
      var data = await res.json()
      if (!data.success) {
        var err = new Error(data.error || 'Password reset failed')
        err.code = 'RESET_FAILED'
        this.onError(err)
        throw err
      }
      return data
    } catch (err) {
      if (err && err.code) throw err
      var nerr = new Error("We couldn't reach the server. Check your connection and try again.")
      nerr.code = 'NETWORK_ERROR'
      this.onError(nerr)
      throw nerr
    }
  }

  async signOut() {
    this._stopRefreshTimer()

    try {
      await fetch(this.baseUrl + '/signout?app_id=' + encodeURIComponent(this.appId), {
        method: 'POST',
        credentials: 'include'
      })
    } catch (err) {
      err.code = 'NETWORK_ERROR'
      this.onError(err)
    }

    this.user = null
    this._notifyListeners()
  }

  async checkSession() {
    try {
      var res = await fetch(this.baseUrl + '/session?app_id=' + encodeURIComponent(this.appId), {
        credentials: 'include'
      })

      if (res.ok) {
        this.user = (await res.json()) || null
        this._notifyListeners()
        if (!this.user) {
          this._stopRefreshTimer()
          return null
        }
        this._startRefreshTimer()
        this._refreshSession()
        return this.user
      }
      this._stopRefreshTimer()
      return null
    } catch (err) {
      err.code = 'NETWORK_ERROR'
      this.onError(err)
      return null
    }
  }

  getUser() {
    return this.user
  }

  isAuthenticated() {
    return this.user !== null
  }

  onAuthStateChange(callback) {
    this.listeners.push(callback)
    callback(this.user)
    var self = this
    return function () {
      self.listeners = self.listeners.filter(function (l) { return l !== callback })
    }
  }

  _refreshSession() {
    fetch(this.baseUrl + '/refresh?app_id=' + encodeURIComponent(this.appId), {
      method: 'POST',
      credentials: 'include'
    }).catch(function () {
    })
  }

  _startRefreshTimer() {
    this._stopRefreshTimer()
    var self = this
    this._refreshTimer = setInterval(function () {
      if (self.user) {
        self._refreshSession()
      }
    }, 30 * 60 * 1000)
  }

  _stopRefreshTimer() {
    if (this._refreshTimer) {
      clearInterval(this._refreshTimer)
      this._refreshTimer = null
    }
  }

  _notifyListeners() {
    var self = this
    this.listeners.forEach(function (listener) {
      try {
        listener(self.user)
      } catch (err) {
        console.error('Error in auth state listener:', err)
      }
    })
  }
}

if (typeof window !== 'undefined') {
  window.GenMBGoogleAuth = GenMBGoogleAuth;
}


// Auto-initialize
window.genmb = window.genmb || {};
const config = {
  "appId": "yA5ttgjUkVzs",
  "baseUrl": "/api/auth/google"
};
window.genmb.auth = new GenMBGoogleAuth(config);
window.genmb.auth.ready();
})();

// GenMB vector-db SDK (Capability)
(function() {
class GenMBVectorDB {
  constructor({ appId, baseUrl }) {
    if (!appId) {
      throw new Error('GenMBVectorDB: appId is required')
    }
    this.appId = appId
    this.baseUrl = (baseUrl || '').replace(/\/$/, '')
    if (!this.baseUrl) {
      this.baseUrl = window.location.origin
    }
    this._endpoint = this.baseUrl + '/api/services/' + this.appId + '/vector-db'
    this._timeout = 60000
  }

  async ingest(text, metadata) {
    if (!text || typeof text !== 'string') {
      throw new Error('ingest() requires a non-empty text string')
    }

    var title = metadata && metadata.title ? metadata.title : undefined
    var meta = metadata ? Object.assign({}, metadata) : {}
    if (meta.title) delete meta.title

    var response = await this._fetch(this._endpoint + '/ingest', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text, metadata: meta, title: title }),
    })

    return response.data
  }

  async ingestFile(file, metadata) {
    if (!file || !(file instanceof File || (file.name && file.size))) {
      throw new Error('ingestFile() requires a File object')
    }

    var formData = new FormData()
    formData.append('file', file)
    if (metadata) {
      formData.append('metadata', JSON.stringify(metadata))
    }

    var response = await this._fetch(this._endpoint + '/ingest-file', {
      method: 'POST',
      body: formData,
    })

    return response.data
  }

  async search(query, options) {
    if (!query || typeof query !== 'string') {
      throw new Error('search() requires a non-empty query string')
    }

    var body = { query: query }
    if (options && options.limit != null) body.limit = options.limit
    if (options && options.filter) body.filter = options.filter

    var response = await this._fetch(this._endpoint + '/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    })

    return response.data
  }

  async delete(documentId) {
    if (!documentId) {
      throw new Error('delete() requires a documentId')
    }

    var response = await this._fetch(this._endpoint + '/documents/' + documentId, {
      method: 'DELETE',
    })

    return response.data || { success: response.success }
  }

  async list(options) {
    var params = new URLSearchParams()
    if (options && options.limit != null) params.set('limit', String(options.limit))
    if (options && options.offset != null) params.set('offset', String(options.offset))

    var url = this._endpoint + '/documents'
    var qs = params.toString()
    if (qs) url += '?' + qs

    var response = await this._fetch(url, { method: 'GET' })
    return response.data
  }

  async _fetch(url, options) {
    var controller = new AbortController()
    var timer = setTimeout(function () { controller.abort() }, this._timeout)

    try {
      var response = await fetch(url, Object.assign({}, options, { signal: controller.signal }))
      clearTimeout(timer)

      var data = await response.json()

      if (!response.ok || !data.success) {
        var err = new Error(data.error || data.detail || 'Vector DB request failed (status ' + response.status + ')')
        err.code = data.error_code
        err.status = response.status
        throw err
      }

      return data
    } catch (err) {
      clearTimeout(timer)
      if (err.name === 'AbortError') {
        throw new Error('Vector DB request timed out')
      }
      throw err
    }
  }
}

// GenMB kv SDK (Capability)
(function() {
function _friendlyMsg(s) {
  if (!s) return 'Something went wrong. Please try again.'
  var t = String(s)
  if (/too large|exceeds|payload too|value too/i.test(t)) return 'That is too big to save. Please use a smaller value.'
  if (/too many|quota|limit reached|max keys/i.test(t)) return 'This app has reached its storage limit.'
  if (/being set up|setting up/i.test(t)) return 'Setting things up. Please try again in a moment.'
  if (/not a number|not numeric|cannot increment/i.test(t)) return "That value can't be counted. Please reset it first."
  if (/request failed \(http\s*\d+\)/i.test(t) || /\bhttp\s+\d{3}\b/i.test(t)) {
    return "Couldn't reach saved data. Please try again in a moment."
  }
  return t
}

function _kvError(raw, status) {
  var err = new Error(_friendlyMsg(raw))
  err.detail = raw ? String(raw) : err.message
  if (status) err.status = status
  if (typeof console !== 'undefined' && console.warn) {
    console.warn('[genmb.kv] ' + err.detail)
  }
  return err
}

class GenMBKeyValueStore {
  constructor(config) {
    if (!config.appId) {
      throw new Error('GenMBKeyValueStore: appId is required')
    }
    this._base = (config.baseUrl || '/api/kv') + '/' + config.appId
  }

  get(key) {
    return this._request('GET', this._base + '/' + encodeURIComponent(key), null, true).then(function (d) {
      return d == null ? null : d.value
    })
  }

  set(key, value) {
    return this._request('POST', this._base, { key: key, value: value })
  }

  delete(key) {
    return this._request('DELETE', this._base + '/' + encodeURIComponent(key))
  }

  list(prefix) {
    var qs = ''
    var parts = []
    if (prefix) parts.push('prefix=' + encodeURIComponent(prefix))
    parts.push('limit=1000')
    qs = '?' + parts.join('&')
    return this._request('GET', this._base + qs)
  }

  increment(key, by) {
    if (by === undefined) by = 1
    return this._request('POST', this._base + '/' + encodeURIComponent(key) + '/increment', { by: by }).then(function (d) {
      return d.value
    })
  }

  async _request(method, url, body, nullOn404) {
    var attempt = 0
    var provisionAttempt = 0
    while (true) {
      var controller = new AbortController()
      var timer = setTimeout(function () { controller.abort() }, 30000)
      try {
        var options = {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          signal: controller.signal
        }
        if (body) {
          options.body = JSON.stringify(body)
        }
        var res = await fetch(url, options)
        clearTimeout(timer)
        if (!res.ok) {
          if (res.status === 404 && nullOn404) {
            return null
          }
          if (res.status >= 500 && attempt < 2) {
            attempt++
            await new Promise(function (r) { setTimeout(r, 300 * attempt) })
            continue
          }
          var errBody = null
          try { errBody = await res.json() } catch (_) {}
          var raw = (errBody && (errBody.error || errBody.detail)) || ('Request failed (HTTP ' + res.status + ')')
          if (/being set up|setting up/i.test(raw) && provisionAttempt < 6) {
            provisionAttempt++
            await new Promise(function (r) { setTimeout(r, Math.min(3000, 800 * provisionAttempt)) })
            continue
          }
          throw _kvError(raw, res.status)
        }
        var result = await res.json()
        if (!result.success) {
          throw _kvError(result.error, res.status)
        }
        return result.data
      } catch (err) {
        clearTimeout(timer)
        if (err.name === 'AbortError') {
          if (attempt < 2) {
            attempt++
            await new Promise(function (r) { setTimeout(r, 300 * attempt) })
            continue
          }
          throw new Error('The store took too long to respond. Please try again.')
        }
        throw err
      }
    }
  }
}


// Auto-initialize
window.genmb = window.genmb || {};
const config = {
  "appId": "yA5ttgjUkVzs",
  "baseUrl": "/api/kv"
};
window.genmb.kv = new GenMBKeyValueStore(config);
})();
</script>

// GenMB search SDK (Capability)
(function() {
class GenMBSearch {
  constructor({ appId, baseUrl } = {}) {
    if (!appId) throw new Error('GenMBSearch: appId is required')
    this.appId = appId
    this.baseUrl = ((baseUrl || '/api/search').replace(/\/$/, '')) + '/' + appId
  }

  async ready() { return this }

  async web(query, options = {}) { return this._search('/web', query, options) }

  async news(query, options = {}) { return this._search('/news', query, options) }

  async _search(path, query, options = {}) {
    if (!query || typeof query !== 'string') {
      throw new Error('search query is required (string)')
    }
    const numResults = Math.max(1, Math.min(options.numResults || options.count || 6, 10))

    const res = await fetch(this.baseUrl + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ query: query.slice(0, 500), numResults }),
    })

    const json = await res.json().catch(() => ({}))
    if (!res.ok || json.success === false) {
      throw Object.assign(
        new Error(json.error || json.detail || `search failed (${res.status})`),
        { code: json.error_code || json.code },
      )
    }

    const data = json.data !== undefined ? json.data : json
    const results = Array.isArray(data.results) ? data.results : []

    return results.map((r) => {
      let host = r.host || ''
      if (!host) {
        try { host = new URL(r.url).hostname.replace(/^www\./, '') } catch (e) { host = '' }
      }
      const favicon = host ? `https://www.google.com/s2/favicons?domain=${host}&sz=128` : ''
      return {
        ...r,
        host,
        favicon,
        image: r.imageUrl || favicon,
      }
    })
  }
}

window.GenMBSearch = GenMBSearch

  "appId": "yA5ttgjUkVzs",
  "baseUrl": "/api/search"
};
window.genmb.search = new GenMBSearch(config);
window.genmb.search.ready();
})();

(function() {

var RESUMABLE_THRESHOLD = 8 * 1024 * 1024
var CHUNK_RETRIES = 3

class GenMBFileStorage {
  constructor({ appId, baseUrl }) {
    if (!appId) {
      throw new Error('GenMBFileStorage: appId is required')
    }
    this.appId = appId
    this.baseUrl = (baseUrl || '').replace(/\/$/, '')
    if (!this.baseUrl) {
      this.baseUrl = window.location.origin
    }

      for (var i = 0; i < w; i++) {
        var sample = Math.abs(data[i * step] || 0) / 128
        var barH = Math.max(2, sample * h)
        ctx.fillRect(i, (h - barH) / 2, 1, barH)
      }
    }

    _escape(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      })
    }
  }

  window.customElements.define('genmb-audio', GenMBAudio)
})()

})();
</script>

// GenMB image-ai SDK (Capability)
(function() {
class GenMBAI {
  constructor(config) {
    if (!config || !config.appId) {
      throw new Error('GenMBAI: appId is required')
    }
    this.appId = config.appId
    this.baseUrl = (config.baseUrl || '').replace(/\/$/, '')
  }

  async complete(promptOrOptions, options = {}) {
    const isObject = promptOrOptions && typeof promptOrOptions === 'object'
    const opts = isObject ? promptOrOptions : (options || {})
    const raw = isObject ? opts.prompt : promptOrOptions

    if (!raw || typeof raw !== 'string' || !raw.trim()) {
      throw new Error('Prompt is required')
    }

    const body = {
      prompt: this._clampPrompt(raw),
      appId: this.appId,
      maxTokens: opts.maxTokens || 500
    }
    if (opts.enableSearch) body.enableSearch = true

    return this._request(`${this.baseUrl}/api/ai/completion`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    })
  }

  async analyzeImage(file, prompt = 'Describe this image', options = {}) {
    if (!file) {
      throw new Error('Image file is required')
    }
    if (typeof file.size === 'number' && file.size > 10 * 1024 * 1024) {
      const err = new Error('Image too large (max 10MB)')
      err.code = 'IMAGE_TOO_LARGE'
      throw err
    }

    const formData = new FormData()
    formData.append('image', file)
    formData.append('prompt', this._clampPrompt(prompt || 'Describe this image'))
    formData.append('appId', this.appId)
    if (options.maxTokens) formData.append('maxTokens', String(options.maxTokens))

    return this._request(`${this.baseUrl}/api/ai/completion/image`, {
      method: 'POST',
      body: formData
    })
  }

  _clampPrompt(prompt) {
    const MAX_PROMPT_CHARS = 16000
    if (prompt.length <= MAX_PROMPT_CHARS) return prompt
    try { console.warn(`[genmb.ai] prompt exceeded ${MAX_PROMPT_CHARS} chars; truncated to fit.`) } catch (e) {}
    return prompt.slice(0, MAX_PROMPT_CHARS)
  }

  async _request(url, init) {
    const controller = new AbortController()
    const timer = setTimeout(() => controller.abort(), 60000)

    let res
    try {
      res = await fetch(url, Object.assign({}, init, { signal: controller.signal }))
    } catch (err) {
      clearTimeout(timer)
      if (err.name === 'AbortError') throw new Error('Request timed out')
      throw err
    }
    clearTimeout(timer)

    if (!res.ok) {
      if (res.status === 429) {
        const err = new Error('Rate limit exceeded (100 requests/hour)')
        err.code = 'RATE_LIMITED'
        throw err
      }
      throw new Error('Request failed')
    }

    const json = await res.json()
    if (json && json.success === false) {
      const err = new Error(json.error || 'AI request failed')
      err.code = json.error_code || 'AI_ERROR'
      throw err
    }
    return (json && json.data && json.data.text) || ''
  }
}


// Auto-initialize
window.genmb = window.genmb || {};
const config = {
  "appId": "yA5ttgjUkVzs"
};
window.genmb.ai = new GenMBAI(config);
})();
</script>

// GenMB rbac SDK (Capability)
(function() {
class GenMBRBAC {
  constructor({ appId }) {
    if (!appId) {
      throw new Error('GenMBRBAC: appId is required')
    }

    this.appId = appId
    this._role = null
    this._permissions = []
    this._listeners = []
    this._ready = false
    this._readyPromise = null
    this._roleLoader = null
    this._unsubscribeAuth = null
  }

  setRoleLoader(loader) {
    this._roleLoader = loader
  }

  async ready() {
    if (this._ready) return this
    if (this._readyPromise) return this._readyPromise

    this._readyPromise = (async () => {
      try {
        if (window.genmb && window.genmb.auth) {
          await window.genmb.auth.ready()

          this._unsubscribeAuth = window.genmb.auth.onAuthStateChange(async (user) => {
            if (user && this._roleLoader) {
              await this._loadRole(user)
            } else {
              this._role = null
              this._permissions = []
              this._notifyListeners()
            }
          })
        }
      } catch (err) {
        console.error('GenMBRBAC: Error during initialization:', err)
      }

      this._ready = true
      return this
    })()

    return this._readyPromise
  }

  async _loadRole(user) {
    try {
      const result = await this._roleLoader(user)
      if (result && result.role) {
        this._role = result.role
        this._permissions = result.permissions || []
        this._notifyListeners()
      }
    } catch (err) {
      console.error('GenMBRBAC: Error loading role:', err)
    }
  }

  setRole(role, permissions) {
    if (typeof role !== 'string') {
      console.error('GenMBRBAC: role must be a string')
      return
    }
    this._role = role
    this._permissions = Array.isArray(permissions) ? permissions : []
    this._notifyListeners()
  }

  clearRole() {
    this._role = null
    this._permissions = []
    this._notifyListeners()
  }

  getRole() {
    return this._role
  }

  getRolePermissions() {
    return this._permissions.slice()
  }

  hasRole(role) {
    return this._role === role
  }

  hasPermission(permission) {
    return this._permissions.includes('*') || this._permissions.includes(permission)
  }

  isAdmin() {
    return this._role === 'admin'
  }

  requireRole(role) {
    if (this._role !== role) {
      throw new Error('Access denied: requires role "' + role + '"')
    }
  }

  requirePermission(permission) {
    if (!this.hasPermission(permission)) {
      throw new Error('Access denied: requires permission "' + permission + '"')
    }
  }

  onRoleChange(callback) {
    this._listeners.push(callback)
    callback(this._role, this._permissions)
    return () => {
      this._listeners = this._listeners.filter(l => l !== callback)
    }
  }

  _notifyListeners() {
    this._listeners.forEach(listener => {
      try {
        listener(this._role, this._permissions)
      } catch (err) {
        console.error('GenMBRBAC: Error in role change listener:', err)
      }
    })
  }
}

if (typeof window !== 'undefined') {
  window.GenMBRBAC = GenMBRBAC;
}


// Auto-initialize
window.genmb = window.genmb || {};
const config = {
  "appId": "yA5ttgjUkVzs"
};
window.genmb.rbac = new GenMBRBAC(config);
})();
</script>

// GenMB audit-log SDK (Capability)
(function() {
class GenMBAudit {
  constructor({ appId, baseUrl } = {}) {
    if (!appId) throw new Error('GenMBAudit: appId is required')
    this.appId = appId
    this.baseUrl = ((baseUrl || '/api/audit').replace(/\/$/, '')) + '/' + appId
  }

  async ready() { return this }

  async log(action, entityType, entityId, meta) {
    if (!action) throw new Error('audit.log requires action')
    return this._json('POST', '/log', {
      action,
      entityType: entityType || null,
      entityId: entityId || null,
      meta: meta || null,
    })
  }

  async list({ entityType, entityId, action, userId, limit, before } = {}) {
    const params = []
    if (entityType) params.push('entityType=' + encodeURIComponent(entityType))
    if (entityId) params.push('entityId=' + encodeURIComponent(entityId))
    if (action) params.push('action=' + encodeURIComponent(action))
    if (userId) params.push('userId=' + encodeURIComponent(userId))
    if (limit) params.push('limit=' + limit)
    if (before) params.push('before=' + encodeURIComponent(before))
    const qs = params.length ? '?' + params.join('&') : ''
    return this._json('GET', '/list' + qs)
  }

  async _json(method, path, body) {
    const init = { method, headers: { 'Content-Type': 'application/json' }, credentials: 'include' }
    if (body !== undefined) init.body = JSON.stringify(body)
    const res = await fetch(this.baseUrl + path, init)
    if (!res.ok) {
      const err = await res.json().catch(() => ({}))
      const e = new Error(err.error || `audit ${path} failed (${res.status})`)
      e.code = err.code || `HTTP_${res.status}`
      e.status = res.status
      throw e
    }
    const json = await res.json()
    return json.data !== undefined ? json.data : json
  }
}

window.GenMBAudit = GenMBAudit


// Auto-initialize
window.genmb = window.genmb || {};
const config = {
  "appId": "yA5ttgjUkVzs",
  "baseUrl": "/api/audit"
};
window.genmb.audit = new GenMBAudit(config);
window.genmb.audit.ready();
})();
</script>
